<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venezuela Rabbit Hole – prototype</title>
<style>
  :root {
    --night: #14110f;
    --paper: #f1e6d2;
    --gold: #f2b632;
    --blue: #1d4ea3;
    --red: #c4302b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden;
    font-family: Georgia, "Times New Roman", serif; color: var(--paper); }
  #stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #dialogue { position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%);
    width: min(780px, 92vw); padding: 22px 28px 24px; background: rgba(20, 17, 15, .82);
    border-left: 6px solid var(--gold); }
  #npc-text { font-size: clamp(20px, 2.6vw, 30px); line-height: 1.45; min-height: 3em; margin: 0; }
  #hint { margin: 12px 0 0; font-size: 16px; color: var(--gold); font-style: italic; opacity: 0; transition: opacity .6s; }
  #hint.show { opacity: 1; }

  #whisper { position: fixed; top: 9vh; left: 50%; transform: translateX(-50%); font-size: 22px; font-style: italic;
    opacity: 0; transition: opacity .5s; text-shadow: 0 2px 8px #000; }
  #whisper.show { opacity: 1; }

  #path-box { position: fixed; top: 14vh; left: 50%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity 1s; }
  #path-box.show { opacity: 1; }
  #path-box p { margin: 0 0 8px; font-size: 18px; }
  #path-line { font-size: clamp(30px, 5vw, 56px); letter-spacing: .08em; }

  #idle { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    background: var(--night); transition: opacity 1s; }
  #idle h1 { font-size: clamp(34px, 6vw, 72px); font-weight: normal; margin: 0 0 12px; }
  #idle p { margin: 0; font-size: 20px; opacity: .7; }
  #idle .bar { height: 6px; width: 180px; margin: 0 auto 28px;
    background: linear-gradient(90deg, var(--gold) 50%, var(--blue) 50% 75%, var(--red) 75%); }
  .hidden { opacity: 0 !important; pointer-events: none; }

  #hud { position: fixed; top: 10px; left: 10px; padding: 10px 14px; font: 13px/1.5 Consolas, monospace;
    background: rgba(0,0,0,.65); white-space: pre; }

  #sound-btn { position: fixed; bottom: 14px; right: 14px; padding: 8px 14px; cursor: pointer;
    background: rgba(20,17,15,.7); border: 1px solid var(--gold); color: var(--paper);
    font: 14px Consolas, monospace; letter-spacing: .05em; }
  #sound-btn.off { border-color: #555; color: #888; }
  #sound-btn:hover { background: rgba(242,182,50,.18); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
  <div id="stage"></div>

  <div id="whisper"></div>
  <div id="path-box"><p>Your rabbit hole</p><div id="path-line"></div></div>

  <div id="dialogue">
    <p id="npc-text"></p>
    <p id="hint"></p>
  </div>

  <div id="idle">
    <div>
      <div class="bar"></div>
      <h1>Someone is here?</h1>
      <p>Step in front of the screen.</p>
    </div>
  </div>

  <div id="hud"></div>

  <button id="sound-btn" title="Toggle voice (V)">&#128266; voice: on</button>

  <script type="module" src="src/game.js"></script>
</body>
</html>

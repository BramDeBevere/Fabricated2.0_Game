<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venezuela Rabbit Hole – prototype</title>
<style>
  :root {
    --night: #14110f;
    --paper: #f1e6d2;
    --gold: #f2b632;
    --blue: #1d4ea3;
    --red: #c4302b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden;
    font-family: Georgia, "Times New Roman", serif; color: var(--paper); }
  #stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #dialogue { position: fixed; left: 50%; bottom: 3vh; transform: translateX(-50%);
    width: min(410px, 76vw); padding: 8px 11px 9px; background: rgba(20, 17, 15, .78);
    border-left: 2px solid var(--gold); }
  #npc-text { font-size: clamp(13px, 1.25vw, 16px); line-height: 1.22; min-height: 0;
    max-height: 12vh; overflow: hidden; margin: 0; }
  #hint { margin: 5px 0 0; font-size: 11px; color: var(--gold); font-style: italic; opacity: 0; transition: opacity .6s; }
  #hint.show { opacity: 1; }

  #whisper { position: fixed; top: 7vh; left: 50%; transform: translateX(-50%); max-width: 70vw;
    padding: 5px 9px; background: rgba(20, 17, 15, .65); font-size: 14px; font-style: italic;
    text-align: center; opacity: 0; transition: opacity .5s; text-shadow: 0 1px 4px #000; }
  #whisper.show { opacity: 1; }

  #path-box { position: fixed; top: 12vh; left: 50%; transform: translateX(-50%); max-width: 82vw;
    text-align: center; opacity: 0; transition: opacity 1s; }
  #path-box.show { opacity: 1; }
  #path-box p { margin: 0 0 4px; font-size: 12px; }
  #path-line { font-size: clamp(17px, 2.4vw, 28px); letter-spacing: .04em; }

  #idle { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    background: var(--night); transition: opacity 1s; }
  #idle h1 { font-size: clamp(25px, 4vw, 46px); font-weight: normal; margin: 0 0 7px; }
  #idle p { margin: 0; font-size: 14px; opacity: .7; }
  #idle .bar { height: 4px; width: 130px; margin: 0 auto 18px;
    background: linear-gradient(90deg, var(--gold) 50%, var(--blue) 50% 75%, var(--red) 75%); }
  .hidden { opacity: 0 !important; pointer-events: none; }

  #hud { position: fixed; top: 7px; left: 7px; padding: 6px 8px; font: 10px/1.35 Consolas, monospace;
    background: rgba(0,0,0,.65); white-space: pre; }

  #sound-btn { position: fixed; bottom: 9px; right: 9px; padding: 5px 8px; cursor: pointer;
    background: rgba(20,17,15,.7); border: 1px solid var(--gold); color: var(--paper);
    font: 11px Consolas, monospace; letter-spacing: .03em; }
  #sound-btn.off { border-color: #555; color: #888; }
  #sound-btn:hover { background: rgba(242,182,50,.18); }
  @media (max-width: 600px) {
    #dialogue { width: min(360px, 84vw); }
    #npc-text { font-size: 13px; max-height: 14vh; }
    #path-line { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
  <div id="stage"></div>

  <div id="whisper"></div>
  <div id="path-box"><p>Your rabbit hole</p><div id="path-line"></div></div>

  <div id="dialogue">
    <p id="npc-text"></p>
    <p id="hint"></p>
  </div>

  <div id="idle">
    <div>
      <div class="bar"></div>
      <h1>Someone is here?</h1>
      <p>Step in front of the screen.</p>
    </div>
  </div>

  <div id="hud"></div>

  <button id="sound-btn" class="off" title="Toggle voice (V)">&#128263; voice: off</button>

  <script type="module" src="src/game.js"></script>
</body>
</html>
